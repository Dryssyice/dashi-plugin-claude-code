# Permission gate policy — Variant 1 (recommended: smooth autonomy).
#
# The owner drives this Claude Code session from Telegram. The session runs
# under `--permission-mode bypassPermissions`, so NO Allow/Deny prompt ever
# appears in the terminal. This file is the only gate. Copy it to your
# workspace as `chats/permission-policy.yaml` (or point
# TELEGRAM_PERMISSION_POLICY_PATH at it) and tune the lists.
#
# Tiers (precedence: deny > confirm > allow > default_tier):
#   deny    — blocked hard, never reaches you.
#   confirm — you get an Allow/Deny button in Telegram; 2-min timeout = deny.
#   allow   — runs silently.
#
# A built-in hard-deny ALWAYS fires regardless of this file: reads/writes of
# .env, *.pem, *.key, .ssh, .aws, gcloud, /proc/*/environ, and catastrophic
# shell (rm -rf /, fork bombs, mkfs, dd to a disk). You cannot un-deny those.
# A built-in confirm ALWAYS fires for sudo, git push, rm -rf, curl|sh,
# base64 -d|sh, mutating systemctl (verb-aware: status/cat/show/list-* flow,
# start/stop/restart/enable/… confirm), kill/pkill, docker, npm publish,
# package installs — unless you explicitly allow-list the exact form below.

version: 1

# Unmatched mutating tools run silently. Read-only tools (Read/Grep/Glob/...)
# always auto-allow, and so does a Bash command PROVEN read-only by the built-in
# check (`git status`, `ls`, `cat`, `rg`, `find` without -exec/-delete, …): every
# stage of every pipeline must be an allowlisted print-only program with checked
# argv, and any redirection, substitution, wrapper or unknown program disables
# it. That check is built in and NOT configurable here — do not try to reproduce
# it with `allow.bash_patterns`, which are substring matches: an allow pattern
# `git status` would also allow `git status && touch pwned`.
#
# Three REVERSIBLE write classes auto-allow on the same terms, because each is
# undone by a single command and touches nothing you keep:
#   * `git add` — the index; undone by `git reset`. Interactive forms (`-i`,
#     `-p`, `-e`) still card: they wait for keystrokes and would hang.
#   * `git commit` with an explicit `-m`/`--message`, plus `-a`, `--allow-empty`
#     and `-q`. Everything else cards — `--amend` (rewrites history),
#     `--no-verify`/`-n` (skips the hooks, i.e. skips the protection),
#     `--author`/`--date` (forges provenance), `-F`/`-C`, and a bare
#     `git commit` (opens $EDITOR and never returns).
#   * The /tmp SANDBOX — `mkdir`, `touch`, `cp`, `mv`, `rm`, `chmod`, and
#     running a file with `bash`/`sh`/`python3`/`node`, but ONLY when EVERY
#     path in the command is strictly inside `/tmp`, `/private/tmp` or `$TMPDIR`
#     (the two macOS spellings of the same directory are treated as equal). A
#     relative path, a `..` segment, or one path outside those roots cards the
#     whole command; so does the root itself (`rm -r /tmp`).
#
# READ THIS BEFORE RELYING ON THE SANDBOX CLASS: allowing an interpreter to run
# a file in /tmp is ARBITRARY CODE EXECUTION. Nothing checks what the script
# does — it can write anywhere, and a symlink inside /tmp can point outside it.
# For the sandbox class this gate is ADVISORY, not preventive: it raises the
# cost of a typo, not of an attack. That is a deliberate owner decision
# (2026-07-31), taken because 16 confirmation cards in two hours on grep,
# `git status` and scratch scripts cost more than they bought.
#
# Cards remain on everything the classes above do not cover: deleting or
# writing outside the sandbox, publishing, money, production, other machines
# (`ssh`/`scp`/`rsync`), and secrets. `rm -rf …` and `chmod -R …` still card
# even inside /tmp — they are built-in confirms that fire before this step.
# Set to `confirm` for Variant 2 (tap to approve every edit).
default_tier: allow

# Operator confirm — risky-but-legitimate operations you want to wave through
# by tapping a Telegram button. Add your project's deploy/DB entrypoints here.
confirm:
  bash_patterns:
    - "deploy.sh"
    - "infra/deploy"
    - "psql"
    - "supabase db"
    - "pm2 restart"
    - "pm2 delete"
    - "rsync"          # production sync
  tools:
    - "mcp__*__task_done"   # marking team tasks done is a real-world side effect

# Operator deny — things you never want to happen, even by tap. Optional;
# the built-in hard-deny already covers secrets and catastrophic shell.
deny:
  bash_patterns:
    - "git push --force"
    - "git push -f"
  read_paths:
    - "**/secrets/**"

# Operator allow — explicit forms that should run silently. NOTE: the built-in
# confirm tier is UNCONDITIONAL — it CANNOT be overridden by an allow rule
# (sudo / git push / rm -rf / curl|sh always reach you as a Telegram confirm).
# So an allow rule only takes effect for commands NOT caught by a built-in
# confirm/deny. Keep this list tight.
allow:
  bash_patterns:
    - "gh pr view"     # read-only gh subcommands you want silent
    - "bun test"

# Per-scope overrides (keyed by CHAT_ID; "main" = the owner's DM session).
# Scope rules are ADDITIVE to the globals above. Example: make the main
# session confirm every package install even if globals allowed it.
# scopes:
#   main:
#     confirm:
#       bash_patterns:
#         - "npm install"
